server:
  port: ${PORT:5000}

spring:
  application:
    name: traffic-fine-system
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/traffic_fine_system}
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-in-production-please}
    expiration-ms: ${JWT_EXPIRE_MS:604800000}   # 7 days, equivalent of JWT_EXPIRE=7d
  cors:
    allowed-origins: ${CORS_ORIGIN:*}
  rate-limit:
    window-minutes: 15
    max-requests: 100
  seed:
    enabled: ${SEED_ON_STARTUP:false}
  frontend:
    build-path: ${FRONTEND_BUILD_PATH:../frontend/build}
  sms:
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      phone-number: ${TWILIO_PHONE_NUMBER:}

logging:
  level:
    root: INFO
    com.police.trafficfine: DEBUG
